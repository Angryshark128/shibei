# 拾贝 · Docker Compose（app-deploy 部署入口）
# 子路径前缀由 SHIBEI_BASE_PATH 控制（默认 /shibei/；如部署为 https://host/apps/shibei/ 则设 /apps/shibei/）。
# 镜像 tag 由 TAG 控制（默认 latest；app-deploy 在 deploy 时按 git tag 名注入；本地构建可手动设）。
# pip 源由 PIP_INDEX_URL 控制（默认官方 PyPI；国内主机可设腾讯云/清华镜像）。
#
# 生产部署：image 名 = 阿里云 ACR 地址（crpi-.../shibei/shibei:<TAG>）。
# 本地构建：把 image 行改回 `build:` + `shibei:${TAG}`，或者用 docker-compose.local.yml 覆盖。

services:
  web:
    image: crpi-eojnonduynx61h32.cn-beijing.personal.cr.aliyuncs.com/shibei/shibei:${TAG:-latest}
    container_name: shibei-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256MiB
        reservations:
          memory: 16MiB
    environment:
      # 初始管理员凭据：仅在首次启动（无 data/web_secrets.json）时生效
      SHIBEI_USERNAME: ${SHIBEI_USERNAME:-admin}
      SHIBEI_PASSWORD: ${SHIBEI_PASSWORD:?请在 .env 中设置 SHIBEI_PASSWORD}
      # 浏览器侧前缀（决定 cookie path），必须与 nginx 前缀一致
      SHIBEI_BASE_PATH: ${SHIBEI_BASE_PATH:-/shibei/}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 抓取数据 / 报告 / 运行时配置 / 凭据全部持久化在宿主 ./data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: crpi-eojnonduynx61h32.cn-beijing.personal.cr.aliyuncs.com/shibei/shibei-nginx:${TAG:-latest}
    container_name: shibei-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256MiB
        reservations:
          memory: 16MiB
    depends_on:
      - web
    ports:
      - "${SHIBEI_HTTP_PORT:-8080}:80"

# 使用：cp .env.example .env（填写 SHIBEI_PASSWORD）后 docker compose up -d --build
# 访问：http://<host>:8080/shibei/（改 SHIBEI_BASE_PATH 可换任意子路径）
