name: Deploy

# shibei 业务仓库 CI/CD（2026-09-18 改造为新规范）：
#   - 业务仓库只推镜像到 ghcr（零 registry secret、零 SSH key）
#   - 部署动作（镜像分发 + SSH 部署）由 app-deploy 仓库执行
#   - 详细规则见 Trilium 笔记《部署规范》(noteId mqVosQPy9Cve)
#
# 触发：仅打 v* tag（如 v0.5.0）；其他 push 不触发构建
# 流程：test → build + push ghcr → repository_dispatch 触发 app-deploy
#
# 注意：app-deploy 私有仓库触发需 PAT，存为 secret APP_DEPLOY_DISPATCH_TOKEN
#（在 hancic128 GitHub Settings → Developer settings → PAT，仅授权 app-deploy 单仓库）

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright .
      - run: uv run pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push shibei (web) to ghcr
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/hancic128/shibei:${{ github.ref_name }}
          build-args: |
            TAG=${{ github.ref_name }}
            VITE_BASE=/shibei/
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push shibei (nginx) to ghcr
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: true
          tags: ghcr.io/hancic128/shibei-nginx:${{ github.ref_name }}
          build-args: |
            NGINX_PREFIX=/shibei/
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger app-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APP_DEPLOY_DISPATCH_TOKEN }}
          repository: hancic128/app-deploy
          event-type: deploy
          client-payload: '{"app":"shibei","tag":"${{ github.ref_name }}"}'

  # 旧版本曾用 deploy job 自建 SSH 部署（host：sh、TCR 临时密码生成、健康检查、版本比对）。
  # 2026-09-18 起全部迁移到 app-deploy 仓库；本 workflow 仅负责镜像构建 + 触发。
  # 如需回滚到旧部署模式，参考 git log 中 deploy.yml@v0.5.0 及之前的版本。