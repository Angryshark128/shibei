name: Deploy

# 打 tag（v*）或手动触发时部署到 sh 主机：runner rsync 源码 → sh 本地 docker compose 构建并重启。
# sh（国内）访问 GitHub / Docker Hub 官方源受限，故不推送镜像，改由 sh 本地构建。
#
# 复用本机统一主机凭据（与 acme-cron / tj-quant 等同名）：
#   Variables: HOST_SH_IP=172.81.241.149、HOST_SH_USER=root
#   Secrets:   HOST_SH_SSH_KEY（部署私钥 base64，公钥在 sh root 的 authorized_keys）
#
# 部署目录 /root/shibei：.env 与 data/（每日报告归档、抓取数据、web_secrets 凭据）
# 只存在于服务器，rsync 一并排除，不随部署覆盖。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.HOST_SH_SSH_KEY }}
          HOST: ${{ vars.HOST_SH_IP }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步代码
        env:
          HOST: ${{ vars.HOST_SH_IP }}
          USER: ${{ vars.HOST_SH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p /root/shibei"
          rsync -az --delete -e 'ssh -i ~/.ssh/deploy_key' \
            ./ "$USER@$HOST:/root/shibei/" \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude 'data/' \
            --exclude '.venv' --exclude '.pylibs' \
            --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.ruff_cache' \
            --exclude 'frontend/node_modules' --exclude 'frontend/dist' \
            --exclude '.v2ex-grey-backup' --exclude '*.log'

      - name: 部署（sh 本地构建镜像 + compose up）
        env:
          HOST: ${{ vars.HOST_SH_IP }}
          USER: ${{ vars.HOST_SH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" '
            set -e
            cd /root/shibei
            docker compose up -d --build --remove-orphans
            sleep 8
            docker compose ps'

      - name: 验证
        env:
          HOST: ${{ vars.HOST_SH_IP }}
          USER: ${{ vars.HOST_SH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" '
            for i in 1 2 3 4 5; do
              curl -sf -o /dev/null http://127.0.0.1:18080/ && echo "服务 OK" && exit 0
              sleep 3
            done
            echo "服务未就绪"; exit 1'
