name: CI

# 只手动触发，不随 push / PR 自动跑（节省 Actions 额度）。
# 发版时的完整测试由 deploy.yml 的 test job 覆盖（打 v* tag 触发）。
# 需要多版本矩阵验证时，在 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright .
      - name: Test
        run: uv run pytest
