# 使用 local 钩子：直接调用 dev 依赖中已安装的工具，无需联网拉取远程仓库。
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]  # 不碰 json/yaml（ruff 的 JSONC 风格会破坏 json.load）
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, markdown]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
